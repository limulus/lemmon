[package]
name = "lemmon-wasm"
description = "wasm-bindgen boundary for the Lemmon core"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

# `rlib` alongside `cdylib` is required, not decorative: without it `cargo test` cannot
# link this crate for host-target unit tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lemmon-vm = { path = "../lemmon-vm" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
