name: Continuous Integration

# Publishing is deliberately absent: nothing here is released yet, and how a monorepo's
# packages get versioned and published (semantic-release or otherwise) is an open
# question. Re-add a publish job when the first release is planned.
on: push

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '24', '26' ]
    name: verify using node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage (node v${{ matrix.node }})
          path: coverage/
      # Type-checking does not emit, so build here to catch diagnostics that only
      # surface during declaration emit (e.g. private names in exported API).
      - run: npm run build
