name: Continuous Integration

# `release`, last, publishes both packages from main: a push to main of a `feat`, `fix`,
# `perf` or `revert` commit, or of a breaking change, releases them.
#
# Shape: build the wasm once, consume it many times. `wasm` produces the artifact and
# `wasm-check` exercises it on every node version, so each runtime is tested against the
# exact bytes that would ship rather than its own rebuild. Host-target Rust checks sit in
# `rust`, outside the node matrix, because nothing about them varies by node version.
#
# The cost of that split: CI no longer runs the single `npm run verify` command pre-push
# runs. The jobs below are its parts — `rust` is `npm:rust`, `verify` is `npm:verify:js`,
# and `verify` is defined as exactly those two. Keep that true when adding a leg.
#
# `rust-coverage` is the deliberate exception, alongside `wasm`/`wasm-check`: coverage
# instrumentation needs different RUSTFLAGS and therefore a second target tree, which is
# not worth rebuilding on every pre-push run. It is CI-only on purpose.
on: push

jobs:
  # Host-target only: fmt, clippy, cargo test. Once, not once per node version.
  rust:
    runs-on: ubuntu-latest
    name: rust (fmt, clippy, test)
    steps:
      - uses: actions/checkout@v7
      # rust-cache keys on the active rustc version, so the toolchain has to be resolved
      # before it runs — any cargo invocation in the repo root makes rustup honor
      # rust-toolchain.toml, keeping that file the single source of the pin.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: npm run rust

  # A ratchet, not an aspiration: the threshold in `rust:cov` is the measured baseline
  # floored to a whole percent. Raise it when the number rises; never lower it to make a
  # build pass. It counts the `#[cfg(test)] mod tests` blocks too, because this repo's
  # Rust convention colocates them with the code they test.
  rust-coverage:
    runs-on: ubuntu-latest
    name: rust coverage
    steps:
      - uses: actions/checkout@v7
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
      # A prebuilt binary; `cargo install cargo-llvm-cov` would build it from source on
      # every run.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm run rust:cov

  # Cross-compiles the boundary crate, runs wasm-bindgen over it, exercises the real ABI
  # with wasm-bindgen-test, and publishes the artifact set for the jobs below.
  # `rust:wasm:test` is kept out of `npm run verify`: a wasm32 test build is not worth
  # paying on every inner-loop run.
  wasm:
    runs-on: ubuntu-latest
    name: build wasm32 artifact
    steps:
      - uses: actions/checkout@v7
      # Staging is a .ts script run through Node's type stripping, so the runner's default
      # Node is not necessarily new enough.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binaries: wasm-bindgen for staging, and the test runner it ships with.
      # The version must match the wasm-bindgen pin in Cargo.toml — the CLI refuses to
      # run on a skew, so a drift fails loudly here.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - run: npm run rust:wasm
      - run: npm run rust:wasm:test
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: packages/core/artifacts/wasm/
          if-no-files-found: error
          retention-days: 1

  # `needs: wasm` because @limulus/lemmon-core's vitest specs load the staged artifact —
  # the tests consume the exact bytes that would ship, the same trade wasm-check makes.
  # The price is that TypeScript-only feedback waits on the (cached) cargo build.
  # `is-ci` skips `verify:js`'s own restage here.
  verify:
    runs-on: ubuntu-latest
    needs: wasm
    strategy:
      matrix:
        node: [ '24', '26' ]
    name: verify using node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: packages/core/artifacts/wasm/
      - run: npm run verify:js
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage (node v${{ matrix.node }})
          path: coverage/
      # Type-checking does not emit, so build here to catch diagnostics that only
      # surface during declaration emit (e.g. private names in exported API).
      - run: npm run build
      # The boundary-marshalling record ∆TNT owes: numbers land in the job log.
      - run: npm run wasm:bench

  # Packs both packages as a release publishes them, installs the tarballs into an empty
  # project, and builds a site there with the installed `lem`, so a package that cannot run
  # from `node_modules` (a TypeScript bin, a `.wasm` left out, the shell pinned to another
  # core) fails on the push that broke it rather than at a release. Per Node, since which
  # files Node will load from `node_modules` is Node's to decide. Not a leg of `verify:js`,
  # which neither builds nor needs the network.
  pack:
    runs-on: ubuntu-latest
    needs: wasm
    strategy:
      matrix:
        node: [ '24', '26' ]
    name: pack and install on node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: packages/core/artifacts/wasm/
      - run: npm run build
      - run: npm run test:pack

  # Where the node matrix genuinely earns its keep: building a .wasm never consults Node,
  # but *accepting* one does — which WebAssembly proposals a runtime enables moves between
  # node majors. No `npm ci`: the check script has no dependencies.
  wasm-check:
    runs-on: ubuntu-latest
    needs: wasm
    strategy:
      matrix:
        node: [ '24', '26' ]
    name: wasm on node v${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: packages/core/artifacts/wasm/
      - run: npm run wasm:check

  # Releases both packages, at one version, when the commits on main since the last release
  # hold one that releases (the `ci.yaml` header lists them). semantic-release picks
  # the version, sets it in both manifests, pins the shell to that core, reruns `test:pack`
  # at it, tags the commit, and publishes the core and then the shell through npm's trusted
  # publishing, which names this file as the workflow allowed to publish them, so the job
  # holds no npm token. The `.wasm` is the one every job above tested, and the job waits
  # for all of them, so that nothing red ships. It runs on every push: on any branch but
  # the ones `.releaserc.json` names, main alone, semantic-release releases nothing.
  release:
    needs: [ rust, rust-coverage, wasm, verify, pack, wasm-check ]
    runs-on: ubuntu-latest
    name: release
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm's trusted publishing, and the provenance it attests
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every commit and tag since the last release.
          fetch-depth: 0
      # No npm cache: what publishes is installed from the lockfile alone.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: packages/core/artifacts/wasm/
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
