<p>A layout prints the title with an access tag, and escapes it on the way out:</p>
<pre><code class="language-html"><span class="syn-text syn-html"><span class="syn-entity syn-name syn-tag">&lt;h1</span>&gt;<span class="syn-entity syn-name syn-tag">&lt;lem.page.title</span>&gt;<span class="syn-entity syn-name syn-tag">&lt;/h1</span>&gt;
<span class="syn-entity syn-name syn-tag">&lt;p</span>&gt;Fish <span class="syn-constant syn-character syn-entity">&amp;amp;</span> chips<span class="syn-entity syn-name syn-tag">&lt;/p</span>&gt;<span class="syn-entity syn-name syn-tag">&lt;/code</span>&gt;<span class="syn-entity syn-name syn-tag">&lt;/pre</span>&gt;
</span></code></pre>
<p>The same lines, in a fence that names no language:</p>
<pre><code>&lt;h1&gt;&lt;lem.page.title&gt;&lt;/h1&gt;
&lt;p&gt;Fish &amp;amp; chips&lt;/p&gt;&lt;/code&gt;&lt;/pre&gt;
</code></pre>
