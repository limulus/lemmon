# The Rust half of the repo. The npm half is `package.json`'s workspace; the two are
# stitched together by `npm run verify`, which runs both gates.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/limulus/lemmon"
publish = false

# Only crates actually in use are pinned here. The vetted choices for the stages still to
# come (syntect, …) are recorded in docs/architecture.md §Crates; listing
# them before anything imports them would be a pin nobody is testing.
[workspace.dependencies]
lemmon-corpus = { path = "crates/lemmon-corpus" }
wasm-bindgen = "0.2.127"
wasm-bindgen-test = "0.3.77"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order`, because JSON objects become the VM's insertion-ordered `Map`s and
# `lem-for` walks a map in that order — alphabetising here would reorder every loop.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
logos = "0.16.1"
# Optimal string alignment behind `lemmon_syntax::nearest`, the one did-you-mean policy
# every stage suggests through. No dependencies of its own, so it costs the .wasm almost
# nothing.
strsim = "0.11.1"
proptest = "1.11.0"
tempfile = "3.24.0"
rowan = "0.17.0"
# rust-analyzer's offset -> line:col mapping; shares rowan's `text-size` and keeps
# line starts rather than the text, so a resident index costs almost nothing.
line-index = "0.1.2"
# No default features: they pull in the CLI and syntect, which the core does not use yet
# and which would grow the .wasm by about a megabyte when it does.
comrak = { version = "0.54.0", default-features = false, features = ["attributes"] }
# Behind `datetime`: parsing, the civil calendar, and RFC 3339/2822/strftime formatting.
# `alloc` alone, deliberately — `std` brings a clock, `tz-system` the host's zone, and
# the tzdb features a time-zone database. Without them invariant 1 is structural rather
# than reviewed: the crate has no way to read a clock or an environment.
jiff = { version = "0.2.35", default-features = false, features = ["alloc"] }
# Behind `url()`: one percent-encoding pass over a composed URL. The WHATWG `url` crate
# was the alternative and is the wrong shape — it refuses a relative reference like
# `/feed/` without a base, and pulls `idna`'s tables into the .wasm (D38).
percent-encoding = { version = "2.3.2", default-features = false, features = ["alloc"] }
# Behind `slugify`'s ASCII folding, so that `Dürer` and `Hawaiʻi` give URL segments a
# reader can type. A transliteration table and nothing else — no host capability, and
# `alloc` alone keeps it that way.
deunicode = { version = "1.6.2", default-features = false, features = ["alloc"] }
# The corpus harness's failure report, and dev-only by construction: `lemmon-corpus` is
# never anything but a dev-dependency, so this reaches no shipped build.
similar = "3.2.0"
# Test-only, for the corpus harness: the shell owns YAML and globs (D30, D37), and the
# `host/` corpus models it — front matter parsed with positions, documents matched to
# the collection whose glob names them. Neither enters the wasm.
saphyr = "0.0.12"
glob = "0.3.4"
